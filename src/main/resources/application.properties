spring.application.name=batch-demo

# ---- DataSource (H2 in-memory; swap for MySQL/Postgres in real use) ----
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Hibernate JDBC batching (keep batch_size == chunk size) ----
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Logs "executed N JDBC batches" per session so you can SEE batching work
spring.jpa.properties.hibernate.generate_statistics=true
# MySQL only: add ?rewriteBatchedStatements=true to the JDBC URL

# ---- Spring Batch ----
# Do not auto-run jobs at startup; we launch them from the REST API
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# ---- Upload limits ----
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=INFO
